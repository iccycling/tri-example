{{- /*
  Fotogalerie zum Wischen/Klicken. Fotos mit dem photo-Shortcode hineinlegen:
  {{< gallery >}}
    {{< photo src="a.jpg" alt="…" caption="…" />}}
    {{< photo src="b.jpg" alt="…" caption="…" />}}
  {{< /gallery >}}
*/ -}}
<div class="gallery" role="group" aria-roledescription="carousel" aria-label="Photo gallery">
  <div class="gallery-track" tabindex="0">{{ .Inner }}</div>
  <button type="button" class="gallery-btn gallery-prev" aria-label="Previous photo" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
  <button type="button" class="gallery-btn gallery-next" aria-label="Next photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
  <div class="gallery-count" aria-live="polite"></div>
</div>
