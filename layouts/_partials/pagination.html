{{- if gt .TotalPages 1 }}
<nav class="pager" aria-label="Pagination">
  {{ if .HasPrev }}<a href="{{ .Prev.URL }}" rel="prev">← Newer</a>{{ else }}<span></span>{{ end }}
  <span class="pager-pages">Page {{ .PageNumber }} of {{ .TotalPages }}</span>
  {{ if .HasNext }}<a href="{{ .Next.URL }}" rel="next">Older →</a>{{ else }}<span></span>{{ end }}
</nav>
{{- end }}
