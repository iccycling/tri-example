- q: "I have never run before. Can I join?"
  a: "Yes. We run at an easy pace and take walk breaks whenever someone needs one. Everybody started somewhere."
- q: "What pace do you run?"
  a: "Several groups from relaxed to brisk. You choose the one you can chat in. Nobody is dropped."
- q: "Do you do track sessions or intervals?"
  a: "Not as a regular club session. If you want a harder workout, ask us — someone will usually join you."
- q: "What about bad weather and dark mornings?"
  a: "We run in most weather. Wear layers and reflective gear; in the dark we stay on lit paths."
- q: "How do I avoid injuries when I start?"
  a: "Increase slowly, run on soft surfaces when you can, and add strength and mobility work. You will find ideas on our Beyond page."
