- q: "Do I need my own bike?"
  a: "Not for spinning or the gym bikes. For the group rides you need a road or hybrid bike in good working order. No TT bike, no aero bars in the group."
- q: "Can I train indoors on my own?"
  a: "Yes. The Ethos gym has Wattbikes that record power and cadence, which makes them ideal for structured sessions. Ask us how to set up a session."
- q: "Is cycling in London safe?"
  a: "Our group rides stay in Richmond Park, away from the busiest roads. Wear a helmet, use lights and ride predictably. If you are nervous, come to spinning first."
- q: "Where can I store my bike?"
  a: "Student rooms are small — we know. Ask in the group chat; members often share tips and spare space (placeholder)."
- q: "Can I buy a second-hand bike?"
  a: "Please do. Many members did. Ask us before you buy and we will help you check it."
- q: "How do I look after my bike?"
  a: "Keep the chain clean and oiled, check tyre pressure before every ride, and learn to fix a puncture. Members are happy to show you the basics."
