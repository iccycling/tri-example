- q: "Do I have to race?"
  a: "No. Racing is optional. Many members train with us for years without a start number — and that is fine."
- q: "Which race should I start with?"
  a: "A sprint triathlon is the classic first race. Our guide <a href=\"/blog/first-triathlon/\">Your first triathlon</a> explains what to expect."
- q: "What does it cost?"
  a: "Entry fees vary by event. The club subsidises entries for members (details are announced in the WhatsApp group)."
- q: "Do I need a licence?"
  a: "Most UK triathlons ask for a British Triathlon licence (a one-day licence or an annual membership), and BUCS events have their own rules. We explain what you need before every race (please check the current requirements)."
- q: "What kit do I need?"
  a: "A tri suit, and a wetsuit for open-water races, a helmet and your bike. You can buy used kit, and members often pass on kit they no longer use."
- q: "I do not want to race. Can I still come to events?"
  a: "Yes. Supporters and helpers are very welcome. Cheering, holding the bags and marshalling make race day for everybody."
- q: "Where are races announced?"
  a: "In the members' WhatsApp group. Join the club and you will be added."
