- q: "Who can join the club?"
  a: "Students, staff and alumni of Imperial. Special rules apply for associate membership at the Union, so please check there. External athletes can join in exceptional cases — get in touch."
- q: "Do you offer coaching?"
  a: "Our swim sessions are coached, and experienced members are happy to share what they know. If you need more advice, get in touch: we may be able to find someone to support you, free or paid depending on how much you need."
- q: "Do I have to train all three disciplines? How much time does it take?"
  a: "No. Join whichever session suits you, on its own. Most members do one to three sessions a week, and you decide how much to do. Nobody needs to race."
- q: "Triathlon sounds like elite sport. Do I need experience?"
  a: "No. We do triathlon because we are not particularly good at any single discipline. There is no competition inside the club, and personal wellbeing comes first. The impression that triathlon is all about performance is misleading. We care about inclusion, and whatever your level, we are happy to see you."
- q: "What do I need to get started?"
  a: "Running shoes, swimwear and goggles. You do not even need a bike: join our spinning sessions or use a gym bike. Kit you may want later, like a tri suit or wetsuit, can be bought second-hand."
- q: "How much does it cost?"
  a: "Membership is handled through the Imperial College Union (club membership plus Imperial Athletes membership). Prices are listed there (placeholder)."
- q: "Is training safe? Who is responsible?"
  a: "Sessions are organised by volunteers. You take part at your own risk and are responsible for your own fitness. Please tell the person running a session about any health issue that matters, and see a doctor first if you are unsure."
- q: "Who can I talk to if something is wrong?"
  a: "Talk to any committee member, in person or by message. You can also use the welfare and advice services of Imperial College Union. We take every concern seriously and treat it confidentially."
