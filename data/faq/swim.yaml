- q: "Can I join if I cannot swim?"
  a: "Yes. We run a beginner lane with a coach, and plenty of members started from zero. Come to one session and see."
- q: "How fast do I need to be?"
  a: "There is no minimum. Lanes are split by pace, so you always swim with people at a similar level."
- q: "Do I need a wetsuit?"
  a: "Not for the pool. For open water we strongly recommend one; ask in the group chat before buying — members often lend or share."
- q: "Is open-water swimming coached?"
  a: "No. Open-water swims are peer-led, with safety rules everyone follows. Coaching happens in the Monday pool session."
- q: "What does it cost?"
  a: "Membership through the Imperial College Union covers all sessions. Pool entry costs are explained when you join (placeholder)."
